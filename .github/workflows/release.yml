name: Release

# Every merge to main is released by neilmc78/release-on-merge: the next
# patch version by default, or the next minor or major one when the pull
# request's title says [minor] or [major]. manifest.json carries that
# version on the released commit (main isn't changed), then the binaries are
# built from it and attached. Run this workflow by hand to release main
# without a merge.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: write

# Two quick merges are released one after the other, never with one version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: release
        uses: neilmc78/release-on-merge@v1
        with:
          version-files: manifest.json

  build:
    needs: version
    if: needs.version.outputs.tag != ''
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Reject committed local SDK replaces
        run: |
          if grep -Eq '^replace github.com/Silo-Server/silo-plugin-sdk => /' go.mod; then
            echo "go.mod contains a machine-local silo-plugin-sdk replace."
            exit 1
          fi

      - name: Build plugin binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          GOWORK: off
        run: |
          mkdir -p dist
          binary="plugin-${GOOS}-${GOARCH}"
          version="${{ needs.version.outputs.version }}"
          go build -trimpath -ldflags="-s -w -X main.version=${version}" -o "dist/${binary}" .
          checksum=$(shasum -a 256 "dist/${binary}" | awk '{print $1}')
          printf '%s  %s\n' "$checksum" "$binary" > dist/checksums.txt
          sed "s/__CHECKSUM__/${checksum}/" manifest.json > "dist/manifest-${GOOS}-${GOARCH}.json"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/plugin-${{ matrix.goos }}-${{ matrix.goarch }}
            dist/checksums.txt
            dist/manifest-${{ matrix.goos }}-${{ matrix.goarch }}.json

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          : > release/checksums.txt
          for dir in artifacts/plugin-*; do
            platform=$(basename "$dir" | sed 's/plugin-//')
            cp "${dir}/plugin-${platform}" "release/plugin-${platform}"
            cat "${dir}/checksums.txt" >> release/checksums.txt
          done
          sort -u -o release/checksums.txt release/checksums.txt

      # release-on-merge has already created the release, with its notes.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" release/plugin-linux-amd64 release/plugin-linux-arm64 release/checksums.txt --repo "$GITHUB_REPOSITORY" --clobber
